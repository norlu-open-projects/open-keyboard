[package]
name = "rustkey"
version = "0.1.0"
edition = "2024"

[lib]
name = "keyboard_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustkey"
path = "src/main.rs"

[[bin]]
name = "gen_dict"
path = "tools/gen_dict.rs"

[[bin]]
name = "gen_phrases"
path = "tools/gen_phrases.rs"

[dependencies]
dashmap = "6.1"
rayon = "1.10"
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"
jni = "0.21"
zeroize = { version = "1.7", features = ["derive"] }
chacha20poly1305 = "0.10"
log = "0.4"
android_logger = "0.14"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "fuzzy_search"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
